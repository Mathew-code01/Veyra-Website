<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1200" width="1440" height="1200">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="surfaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fafafa"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/>
      <feOffset in="blur" dx="0" dy="8" result="offsetBlur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.10"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur"/>
      <feComposite in="blur" in2="SourceGraphic" operator="out" result="outline"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1440" height="1200" fill="#f8fafc"/>
  <circle cx="1100" cy="-200" r="500" fill="#4338ca" opacity="0.10"/>
  <circle cx="340" cy="1300" r="460" fill="#7c3aed" opacity="0.08"/>

  <!-- VEYRA brand mark (top left) -->
  <g transform="translate(60, 60)">
    <rect width="96" height="96" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="10" y="16" width="6" height="64" rx="3" fill="#4338ca"/>
    <path d="M 22 80 L 46 36 L 70 80" stroke="url(#brandGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="46" cy="36" r="5" fill="#4338ca"/>
    <rect x="64" y="46" width="18" height="5" rx="2.5" fill="#c7c7d2"/>
    <rect x="64" y="56" width="12" height="5" rx="2.5" fill="#c7c7d2"/>
    <rect x="64" y="66" width="15" height="5" rx="2.5" fill="#c7c7d2"/>
    <text x="100" y="68" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="800" fill="#0f172a" letter-spacing="2">VEYRA</text>
  </g>

  <!-- Left card: Live interview assistance -->
  <g transform="translate(60, 220)">
    <rect width="640" height="860" rx="32" fill="url(#surfaceGrad)" stroke="#e2e8f0" stroke-width="1" filter="softShadow"/>
    <rect width="640" height="72" rx="32 32 0 0" fill="#f1f5f9"/>
    <rect x="20" y="22" width="12" height="12" rx="6" fill="#ef4444"/>
    <rect x="40" y="22" width="12" height="12" rx="6" fill="#f59e0b"/>
    <rect x="60" y="22" width="12" height="12" rx="6" fill="#10b981"/>
    <text x="520" y="48" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#64748b">Live interview • Active</text>

    <rect x="20" y="120" width="600" height="520" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="40" y="156" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Live assistance</text>
    <text x="40" y="184" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#64748b">"Tell me about a time you resolved a conflict."</text>
    <rect x="40" y="200" width="40" height="3" rx="1.5" fill="#c7c7d2"/>
    <rect x="40" y="212" width="260" height="3" rx="1.5" fill="#c7c7d2"/>

    <!-- Assistant suggestion bubble -->
    <g filter="softShadow">
      <rect x="40" y="240" width="520" height="130" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="40" y="240" width="6" height="130" rx="3" fill="#4338ca"/>
      <text x="70" y="272" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#0f172a">VEYRA suggests:</text>
      <text x="70" y="296" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#475569" max-width="470">Use the STAR method: Situation, Task, Action, Result. Ground your answer in your CV experience.</text>
      <rect x="70" y="316" width="300" height="34" rx="8" fill="#f1f5f9"/>
      <text x="82" y="336" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#64748b">Insert suggested answer</text>
    </g>

    <text x="40" y="410" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Private to you</text>
    <text x="40" y="432" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#64748b">Interviewer never sees the cues. Context from your CV only.</text>

    <rect x="40" y="460" width="280" height="44" rx="10" fill="#4338ca" filter="glow"/>
    <text x="76" y="484" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Start live session</text>
  </g>

  <!-- Right card: Interview practice -->
  <g transform="translate(740, 220)">
    <rect width="640" height="860" rx="32" fill="url(#surfaceGrad)" stroke="#e2e8f0" stroke-width="1" filter="softShadow"/>
    <rect width="640" height="72" rx="32 32 0 0" fill="#f1f5f9"/>
    <rect x="20" y="22" width="12" height="12" rx="6" fill="#10b981"/>
    <rect x="40" y="22" width="12" height="12" rx="6" fill="#10b981"/>
    <rect x="60" y="22" width="12" height="12" rx="6" fill="#10b981"/>
    <text x="520" y="48" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#64748b">Practice session • Ready</text>

    <rect x="20" y="120" width="600" height="520" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="40" y="156" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Interview practice</text>
    <text x="40" y="184" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#64748b">Software Engineer — Behavioral</text>
    <rect x="40" y="200" width="40" height="3" rx="1.5" fill="#c7c7d2"/>
    <rect x="40" y="212" width="260" height="3" rx="1.5" fill="#c7c7d2"/>

    <!-- Question card -->
    <g filter="softShadow">
      <rect x="40" y="240" width="520" height="150" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="40" y="240" width="6" height="150" rx="3" fill="#7c3aed"/>
      <text x="70" y="270" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Practice question</text>
      <text x="70" y="294" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#475569">"Describe a project where you had to make a technical trade-off."</text>
      <rect x="40" y="350" width="520" height="24" rx="4" fill="#f1f5f9"/>
      <text x="70" y="388" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#64748b">2:34 remaining • 3 of 5 questions</text>
    </g>

    <!-- Answer input -->
    <rect x="40" y="400" width="520" height="130" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="56" y="426" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#64748b">Your answer</text>
    <rect x="56" y="440" width="400" height="64" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

    <text x="40" y="560" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">AI feedback</text>
    <rect x="40" y="580" width="520" height="80" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="60" y="604" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#15803d">✓ Strong STAR structure • Consider quantifying the outcome</text>

    <rect x="40" y="680" width="280" height="44" rx="10" fill="#7c3aed" filter="glow"/>
    <text x="76" y="704" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Start practice</text>
  </g>

  <!-- Bottom banner -->
  <rect y="1080" width="1440" height="120" fill="#0f172a"/>
  <text x="60" y="1132" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">VEYRA — Your AI-powered interview companion</text>
  <text x="60" y="1158" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#94a3b8">Live assistance during interviews • Practise before they happen</text>
  <text x="1060" y="1132" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#818cf8">Get started → veyra.example</text>
</svg>
