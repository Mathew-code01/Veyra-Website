<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="veyra-brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="veyra-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur" />
      <feOffset in="blur" dx="0" dy="1" result="offsetBlur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.15" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background vessel -->
  <rect width="64" height="64" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />

  <!-- Left accent bar (indigo) -->
  <rect x="7" y="12" width="4" height="40" rx="2" fill="#4338ca" />

  <!-- V symbol - clean, geometric -->
  <path
    d="M 12 52 L 32 18 L 52 52"
    stroke="url(#veyra-brand-grad)"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Assistant presence dot at V vertex -->
  <circle cx="32" cy="18" r="2.5" fill="#4338ca" />

  <!-- Microphone/sound wave indicator (right side) -->
  <g stroke="#c7c7d2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 44 30 Q 46 26 48 30" />
    <path d="M 44 34 Q 46 28 48 34" />
    <path d="M 44 38 Q 46 32 48 38" />
  </g>

  <!-- Wordmark VEYRA -->
  <text x="14" y="56" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="800" fill="#0f172a" letter-spacing="1.2">VEYRA</text>
</svg>
